# Supabase-Konfiguration für Spotty.
# Die Functions prüfen Anmeldung und Mitgliedschaft selbst; die Plattformprüfung ist deshalb aus.

project_id = "spotty-app"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.assistant]
verify_jwt = false

[functions.extract]
verify_jwt = false

[functions.push-key]
verify_jwt = false

[functions.push-tick]
verify_jwt = false

[functions.admin-users]
verify_jwt = false
